<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base1 :: layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
   <section>
      <div class="card mr-3 ml-3">
        <div class="card-body">
          <div class="container text-center">
         
        
    <img
        th:src="@{/img/contact.jpeg}"
        alt="Contact Image"
        class="rounded-circle"
        style="width:150px; height:150px; object-fit:cover;"
    />
           <h3 class="mt-3"> <span th:text="${user.name}"></span> </h3>
         
         <table class="table">
           <thead>
           <tr>
             <th scope="col">#USERID</th>
             <th scope="col">SCMUSER<span th:text="${user.id}"></span></th>
            </tr>
            </thead>
            <tbody>
               <tr>
               <th scope="row">Email</th>
               <td><span th:text="${user.email}"></span></td>
               </tr>
         
               
               <tr>
               <th scope="row">Role</th>
               <td><span th:text="${user.role}"></span></td>
               </tr>
               
                 <tr>
               <th scope="row">Account Active</th>
               <td><span th:text="${user.enabled}"></span></td>
               </tr>
               
                 <tr>
               <th scope="row">About you</th>
               <td><span th:text="${user.about}"></span></td>
               </tr>
           
            </tbody> 
         </table>
           </div>
          </div>
              </div>     </section>
</body>  </html>
