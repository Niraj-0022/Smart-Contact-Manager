<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        height: 100vh;
    } .login-card {
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        overflow: hidden;
    } .login-left {
        background: linear-gradient(135deg, #5f2c82, #49a09d);
        color: #fff;
        padding: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
.login-left h2 {
        font-weight: 600;
    }
 .login-right {
        padding: 40px; }

    .form-control {
        border-radius: 30px;
        padding: 10px 20px;
    }
  .btn-login {
        border-radius: 30px;
        padding: 10px;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border: none;
    }
 .btn-login:hover {
        opacity: 0.9;
    }  .alert {
        border-radius: 30px;
        font-size: 14px;
    } .login-footer {
        font-size: 14px;
        margin-top: 15px;
        text-align: center;
    }
</style>
</head>
<body><section class="d-flex align-items-center justify-content-center h-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card login-card">
                    <div class="row g-0"> <!-- Left Section -->
                        <div class="col-md-5 login-left d-none d-md-flex">
                            <div>
                                <h2>Welcome Back</h2>
                                <p>Login to access your dashboard</p>
                            </div>
                        </div>
    <!-- Right Section -->
                        <div class="col-md-7 login-right">
                            <h3 class="text-center mb-4">Login</h3>
   <form th:action="@{/signin}" method="post">
 <div th:if="${param.error}" class="alert alert-danger text-center">
                                    Invalid username or password
                                </div>
<div th:if="${param.logout}" class="alert alert-success text-center">
                                    You have been logged out successfully
                                </div>

                                <div class="mb-3">
                                    <input type="email" name="username"
                                           class="form-control"
                                           placeholder="Email address" required>
                                </div>  <div class="mb-3">
                                    <input type="password" name="password"
                                           class="form-control"
                                           placeholder="Password" required>
                                </div> <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-login">
                                        Login
                                    </button>
                                </div>

                                <div class="login-footer">
                                    <p class="mt-3">
                                        <a th:href="@{/forget}">Forgot Password?</a>
                                    </p>
                                </div>

                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
